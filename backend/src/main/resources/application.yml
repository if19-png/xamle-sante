spring:
  application:
    name: xamle-sante
  datasource:
    url: jdbc:postgresql://localhost:5432/xamle_sante
    username: postgres
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
server:
  port: 8080
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: 60