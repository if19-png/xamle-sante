spring:
  application:
    name: xamle-sante
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:xamle_sante}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
  error:
    include-message: always
app:
  seed-demo: ${SEED_DEMO:true}
  cors:
    origins: ${CORS_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: 60
  epidemio:
    seuil-anonymat: 3
    seuil-risque: 5
  sms:
    mode: ${SMS_MODE:simulation}
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      from: ${TWILIO_FROM:}
